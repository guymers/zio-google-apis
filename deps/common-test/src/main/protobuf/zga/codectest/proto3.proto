syntax = "proto3";

package zga.codectest;

option java_outer_classname = "Proto3Java";

// every scalar type, without presence
message Scalars {
  int32 int32_value = 1;
  int64 int64_value = 2;
  uint32 uint32_value = 3;
  uint64 uint64_value = 4;
  sint32 sint32_value = 5;
  sint64 sint64_value = 6;
  fixed32 fixed32_value = 7;
  fixed64 fixed64_value = 8;
  sfixed32 sfixed32_value = 9;
  sfixed64 sfixed64_value = 10;
  float float_value = 11;
  double double_value = 12;
  bool bool_value = 13;
  string string_value = 14;
  bytes bytes_value = 15;
}

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  GREEN = 2;
}

// numbered out of declaration order, with gaps, a negative number and an
// alias, so a value's number is not its ordinal
enum Sparse {
  option allow_alias = true;
  SPARSE_UNSPECIFIED = 0;
  TEN = 10;
  NEGATIVE = -1;
  THREE = 3;
  ALSO_TEN = 10;
}

message Sparses {
  Sparse single = 1;
  repeated Sparse many = 2;
  map<string, Sparse> by_name = 3;
}

// proto3 packs repeated scalars and enums
message Repeated {
  repeated int32 ints = 1;
  repeated sint64 zigzags = 2;
  repeated fixed32 fixeds = 3;
  repeated double doubles = 4;
  repeated bool bools = 5;
  repeated string strings = 6;
  repeated Color colors = 7;
  repeated Scalars messages = 8;
}

message Optionals {
  optional int32 count = 1;
  optional string name = 2;
  optional Color color = 3;
}

message Maps {
  map<string, Color> colors = 1;
  map<int64, Scalars> scalars = 2;
  map<uint32, bytes> blobs = 3;
}

// a oneof whose members are numbered around another field
message Interleaved {
  oneof choice {
    string first = 1;
    Scalars third = 3;
  }
  int32 second = 2;
}
