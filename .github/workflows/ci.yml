name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 17
          java-package: jdk
          cache: sbt

      - name: Install SBT
        uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11

      - name: Lint
        run: sbt --client scalafmtCheckAll

      - name: Compile
        run: sbt --client Test/compile

      - name: Test
        run: sbt --client test

      - name: Shutdown SBT server
        run: sbt --client shutdown
        if: always()
